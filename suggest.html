<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest an installation | FVAI</title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header></header>
    <nav></nav>

    <main>
        <section>
            <form>
                <fieldset>
                    <legend>Suggest An Installation</legend>

                    <label for="userFirstName">Your First Name:</label>
                    <input name="userFirstName" id="userFirstName" placeholder="Jane" type="text">

                    <label for="userLastName">Your Last Name:</label>
                    <input name="userLastName" id="userLastName" placeholder="Doe" type="text">

                    <br>

                    <label for="nameInput">Installation Name:</label>
                    <input name="nameInput" id="nameInput" placeholder="Installation Name">

                    <div id="colorPickerBox">
                        <label for="colorPicker1">Color Palette:</label>

                        <div id="addColorBtn" class="colorBtn">
                            <p>+</p>
                        </div>

                        <div id="subColorBtn" class="colorBtn">
                            <p>-</p>
                        </div>

                        <div id="colorPickerOptions">
                            <input name="colorInput1" id="colorPicker1" class="colorPicker" type="color" value="#070309">
                            <input name="colorInput2" id="colorPicker2" class="colorPicker" type="color" value="#070309">
                            <input name="colorInput3" id="colorPicker3" class="colorPicker" type="color" value="#070309">
                            <input name="colorInput4" id="colorPicker4" class="colorPicker" type="color" value="#070309">
                        </div>
                        
                    </div>

                    <label for="artDescription">
                        <h2>Installation Description:</h2>
                        <textarea name="artDescription" id="artDescription" placeholder="Enter a full description of your suggested art installation here:"></textarea>
                    </label>
                    <button type="button" id="submitFormBtn" onclick="submitForm()">Submit</button>
                </fieldset>
            </form>
        </section>

        <section id="submissionSection">
            <h3 id="submissionTitle">Thank you for your submission!</h3>
            <p id="submissionText"></p>
            <div id="submissionColorPalette"></div>
            <p id="submissionDescription"></p>
        </section>
    </main>

    <footer></footer>
    
</body>
</html>
